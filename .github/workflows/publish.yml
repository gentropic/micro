name: Publish micro PWA

on:
  workflow_dispatch:      # fired by auditable's release (gh workflow run) + manual
  push:
    branches: [main]      # redeploy on any change here (shell, or a refreshed micro.html)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # BUILD uploads the site; DEPLOY (its own job) publishes it. One job doing both asked for the
  # artifact ~0.3 s after uploading it and, from 2026-11-25, often found none ("No artifacts named
  # github-pages") — the two-job shape is GitHub's documented pattern and gives the artifact time
  # to be listed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Prefer the latest auditable RELEASE asset (keeps the deploy in lockstep
      # with releases). Best-effort: if there's no release with micro.html yet,
      # publish.mjs falls back to the committed micro.html seed.
      - name: Fetch latest auditable release (micro.html)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl
          gh release download --repo gentropic/auditable --pattern 'micro.html' --dir dl || \
            echo "no micro.html in a release yet — using the committed seed"

      - name: Assemble the PWA
        run: |
          node publish.mjs ./dl
          mkdir -p _site
          # Serve: the app (index.html) + PWA assets (manifest/sw/icons) + the
          # downloadable single file (rolling micro.html) + the docs page.
          cp index.html manifest.webmanifest sw.js \
             icon.svg icon-192.png icon-512.png \
             icon-maskable.svg icon-192-maskable.png icon-512-maskable.png \
             micro.html .nojekyll _site/
          cp -r docs _site/

      # The manual (the LuaLaTeX book, ~13 MB) is built on Arthur's machine and attached
      # to an auditable release by hand (CI has no TeX and no GPU for its screenshots), so
      # it rides in from the newest release that carries one and is never committed here:
      # 13 MB per rebuild would pile up in this repo's history.
      - name: Fetch the micro manual (PDF)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --repo gentropic/auditable --limit 20 --json tagName -q '.[].tagName'); do
            if gh release download "$tag" --repo gentropic/auditable --pattern 'micro-manual.pdf' --dir _site/docs --clobber 2>/dev/null; then
              echo "micro-manual.pdf from $tag"; break
            fi
          done
          [ -f _site/docs/micro-manual.pdf ] || echo "::warning::no auditable release carries micro-manual.pdf — the docs page's download link will 404"

      # v5 (2026-11-25): v3's artifact stopped being found by deploy-pages — three fresh runs in a
      # row failed "No artifacts named github-pages" after a successful upload. v4+ leaves hidden
      # files out unless asked, so .nojekyll is asked for (an artifact deploy runs no Jekyll anyway).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
